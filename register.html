<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrate</title>
    <script defer src="https://use.fontawesome.com/releases/v5.0.8/js/all.js" integrity="sha384-SlE991lGASHoBfWbelyBPLsUlwY1GwNDJo3jSJO04KZ33K2bwfV9YBauFfnzvynJ" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fonts.css">
</head>
<body>

    <div class="page_title">
        <h4 class="register_form_title">Formulario de registro</h4>
        <p class="register_form_description">Por favor completa este formulario con todos tu datos</p>
    </div>
    
    <section>
        <div class="register_main_container">
            <div class="register_form_main_container">
                <form action="">
                    <div class="form_inputs">
                        <div class="personal_data_container">
                            <select class="dropdown_treatment" name="" id="">
                                <option value="0">Sr.</option>
                                <option value="1">Sra.</option>
                            </select>
                            <input type="text" name="name" class="personal_data_input" placeholder="Nombre" name="" id="">
                            <input type="text" name="lastname" class="personal_data_input" placeholder="Apellido" name="" id="">
                            <select class="dropdown_gender" name="" id="">
                                <option value="0">Seleccione una opción</option>
                                <option value="1">Masculino</option>
                                <option value="2">Femenino</option>
                                <option value="3">Prefiero no decirlo</option>
                            </select>
                        </div>
                        <div>

                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>

</body>
</html>
